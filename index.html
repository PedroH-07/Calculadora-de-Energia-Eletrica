<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Consumo de Energia Elétrica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Consumo de Energia Elétrica</h1>
        
        <!-- Entrada de Dados -->
        <div class="form-group">
            <label for="potencia">Potência do equipamento (W):</label>
            <input type="number" id="potencia" placeholder="Ex: 1000" min="0">
        </div>

        <div class="form-group">
            <label for="horas">Horas de utilização por dia:</label>
            <input type="number" id="horas" placeholder="Ex: 2" min="0" max="24">
        </div>

        <div class="form-group">
            <label for="dias">Dias de utilização no mês:</label>
            <input type="number" id="dias" placeholder="Ex: 30" min="0" max="31">
        </div>

        <!-- Controles -->
        <div class="botoes">
            <button id="btn-calcular">CALCULAR</button>
            <button id="btn-limpar">LIMPAR</button>
        </div>

        <!-- Container para injeção dinâmica do resultado via DOM (JavaScript) -->
        <div id="area-resultado" class="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
